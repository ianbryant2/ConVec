# --- Pareto-AC DCG non-shared, MPE variant ---
# pac_dcg_ns.yaml with two fixes; everything else already matches EPyMARL's
# IA2C-ns MPE values (the closest analog, since PACDCG is actor-critic with
# entropy regularisation, not Q-learning) — lr 0.0005, n-step 10, target
# update 0.01 soft, and FC (not GRU) were already right, so left alone.
#
# 1. hidden_dim -> 128 (was default 64), matching IA2C-ns's MPE choice; obs
#    dim grows with N so the net needs the extra capacity as agents scale up.
# 2. entropy schedule: the original 30.0 -> 0.01 anneal (entropy_end_ratio
#    0.8) is PAC's matrix-game equilibrium-selection setting — massive early
#    entropy to force visiting every joint action in a game with deceptive
#    equilibria. simple_spread's reward is dense and unimodal, so that
#    pressure only delays learning, and the N=8 collapse in the original
#    baseline sweep started right at the 0.8 entropy-floor release point.
#    Replaced with a small constant coefficient, matching IA2C-ns's MPE value.

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

buffer_size: 10
batch_size_run: 10
batch_size: 10

# update the target network every {} training steps
target_update_interval_or_tau: 0.01

lr: 0.0005
hidden_dim: 128

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"

agent_output_type: "pi_logits"
learner: "pac_dcg_learner"
use_rnn: False
standardise_rewards: False
q_nstep: 10 # 1 corresponds to normal r + gammaV

critic_type: "pac_dcg_critic_ns"
state_value_type: "cv_critic_ns"

initial_entropy_coef: .8
final_entropy_coef: 0.01
entropy_end_ratio: 0.8


# Specify the CG
cg_edges: 'full'    # Defines the CG: {'vdn', 'line', 'cycle', 'star', 'full', n_rand_edges:int, [[int,int], .., [int,int]]}
cg_utilities_hidden_dim:      # Hidden layers of utility functions, by default None
cg_payoffs_hidden_dim:        # Hidden layers of payoff functions, by default None
cg_payoff_rank:              # If > 0, payoff matrices are decomposed with this rank, otherwise full rank
duelling: False               # If True, runs DCG-V (adds a state-dependent bias function to the value)
msg_anytime: True             # Anytime extension of greedy action selection (Kok and Vlassis, 2006)
msg_iterations: 8             # Number of message passes in greedy action selection
msg_normalized: True          # Message normalization during greedy action selection (Kok and Vlassis, 2006)


name: "pac_dcg_ns_mpe"
