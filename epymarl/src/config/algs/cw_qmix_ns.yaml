# --- CW-QMIX (Weighted QMIX, NeurIPS 2020), non-shared variant ---
# Ported from OptimisticExploration/config/algs/cw_qmix.yaml; matrix-game
# buffer/target settings matching the opt_* configs. w kept at the repo default
# 0.5 (the README's w=0.01 note applies only to the opt algorithms).

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

runner: "episode"

buffer_size: 32

# update the target network every {} episodes (original WQMIX-style episode counting)
target_update_interval: 1

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"
use_rnn: False
standardise_returns: False
standardise_rewards: False

agent_output_type: "q"
learner: "max_q_learner"
double_q: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

w: 0.5 # $\alpha$ in the paper
hysteretic_qmix: False # False -> CW-QMIX, True -> OW-QMIX

central_loss: 1
qmix_loss: 1

central_mixing_embed_dim: 256
central_action_embed: 1
central_mac: "basic_central_mac"
central_agent: "central_rnn_ns"
central_mixer: "ff"

name: "cw_qmix_ns"
