# --- Pareto-AC non-shared, with an auxiliary learned max-Q critic ---
# Identical to pac_ns.yaml (pac_learner / PACActorCriticLearner); the max
# learner adds a side critic that learns max_{a_-i} Q_i(s, a_-i, a_i) from
# (state, a_i) alone, trained on sampled targets and logged against the
# exact combinatorial max already used by train_critic(). Purely additive:
# does not change the core actor-critic training.

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

buffer_size: 10
batch_size_run: 10
batch_size: 10

# update the target network every {} training steps
target_update_interval_or_tau: 0.01

lr: 0.0003

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"

agent_output_type: "pi_logits"
learner: "pac_max_learner"
initial_entropy_coef: 20.0
final_entropy_coef: 0.01
entropy_end_ratio: 0.8
use_rnn: False
standardise_rewards: False
q_nstep: 10 # 1 corresponds to normal r + gammaV


critic_type: "pac_critic_ns"
state_value_type: "cv_critic_ns"

# auxiliary max-Q critic
max_critic_type: "pac_max_critic_ns"
sample_size: 10 # samples of other agents' joint actions per agent 

name: "pac_sarsa_max_ns"

t_max: 500500
