# --- QTRAN, no parameter sharing (Pareto-AC paper baseline setup) ---
# qtran.yaml with the same deltas the fork applies to its other value-based
# baselines for the Pareto-AC experiments (cf. vdn_ns/qmix_ns): independent
# per-agent networks, no agent ids, Adam, standardised rewards. QTRAN-specific
# hyperparameters are unchanged from qtran.yaml.

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

runner: "episode"

buffer_size: 5000

# update the target network every {} episodes
# (the qtran learner reads pymarl-style target_update_interval, not
# target_update_interval_or_tau)
target_update_interval: 200

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"
optimiser: "adam"
standardise_returns: False
standardise_rewards: True

agent_output_type: "q"
learner: "qtran_learner"
# the untouched pymarl qtran mixer sizes its input by rnn_hidden_dim; epymarl
# renamed that to hidden_dim (default 64) -- keep the two equal
rnn_hidden_dim: 64
double_q: True
mixer: "qtran_base"
use_rnn: False
mixing_embed_dim: 64
qtran_arch: "qtran_paper"
network_size: "small"

opt_loss: 1
nopt_min_loss: 0.1

name: "qtran_ns"
