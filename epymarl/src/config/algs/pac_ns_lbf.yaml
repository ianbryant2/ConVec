# --- Pareto-AC non-shared, LBF variant ---
# pac_ns.yaml retuned for Level-Based Foraging (25-step episodes, sparse
# reward), leaving pac_ns.yaml at its matrix-game settings:
#
# 1. hidden_dim -> 128 (was default 64).
# 2. entropy schedule 0.8 -> 0.02 (was 20.0 -> 0.01): the huge early entropy
#    is PAC's matrix-game equilibrium-selection setting and swamps LBF's
#    sparse reward.
# 3. q_nstep -> 5 (was 10).
# 4. test_greedy False, so evaluation plays the sampled policy.
#
# Its own `name`, so runs land in results/sacred/pac_sarsa_ns_lbf/ rather than
# interleaving with the matrix-game pac_sarsa_ns runs.

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

buffer_size: 10
batch_size_run: 10
batch_size: 10

hidden_dim: 128
test_greedy: False

# update the target network every {} training steps
target_update_interval_or_tau: 0.01

lr: 0.0003

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"

agent_output_type: "pi_logits"
learner: "pac_learner"
initial_entropy_coef: 0.8
final_entropy_coef: 0.02
entropy_end_ratio: 0.8
use_rnn: False
standardise_rewards: False
q_nstep: 5 # 1 corresponds to normal r + gammaV


critic_type: "pac_critic_ns"
state_value_type: "cv_critic_ns"

name: "pac_sarsa_ns_lbf"

t_max: 500500
