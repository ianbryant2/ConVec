# --- QMIX non-shared, MPE-tuned variant ---
# qmix_ns.yaml with the EPyMARL benchmark paper's selected hyperparameters for
# MPE without parameter sharing (arXiv:2006.07869, Table 29): hidden 128,
# lr 3e-4, GRU, epsilon anneal 200k, soft target updates. Everything else
# (buffer, batch, reward standardisation) already matched the paper.

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 200000
evaluation_epsilon: 0.0

runner: "episode"

buffer_size: 5000

target_update_interval_or_tau: 0.01

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"
standardise_returns: False
standardise_rewards: True

hidden_dim: 128
lr: 0.0003

agent_output_type: "q"
learner: "q_learner"
double_q: True
use_rnn: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

name: "qmix_ns_mpe"
