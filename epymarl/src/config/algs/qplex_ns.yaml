# --- QPLEX (dueling mixer, "dmaq"), non-shared variant ---
# Ported from QPLEX/pymarl-master/src/config/algs/qplex.yaml (the non-SC2, non-qatten
# config), plus the epymarl _ns boilerplate used by qmix_ns.yaml / cw_qmix_ns.yaml.
#
# Deliberate deviations from the repo:
# - standardise_rewards: False because the ported learner (dmaq_qatten_learner) doesn't
#   implement reward standardisation itself (epymarl's q_learner does it internally;
#   QPLEX's doesn't). This is the faithful choice, but note qmix_ns runs with True — a
#   comparability caveat.
# - buffer_size: 5000 / target_update_interval: 200 keep the QPLEX repo defaults,
#   consistent with how qmix_ns/qtran_ns keep repo defaults. (The cw/ow/opt configs use
#   buffer 32 / update 1, but that's a WQMIX-repo convention, not applicable here.)
# - The original QPLEX repo shares parameters across agents; this _ns port doesn't,
#   matching the sweep's all-non-shared baseline setup.
# - hypernet_layers is not read by DMAQer — omitted.

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
runner: "episode"
buffer_size: 5000
target_update_interval: 200   # episode-based, consumed by the ported learner
agent_output_type: "q"
learner: "dmaq_qatten_learner"
double_q: True
mixer: "dmaq"
mixing_embed_dim: 32
hypernet_embed: 64
adv_hypernet_layers: 3
adv_hypernet_embed: 64
num_kernel: 10
is_minus_one: True
weighted_head: True
is_adv_attention: True
is_stop_gradient: True

evaluation_epsilon: 0.0
obs_agent_id: False
obs_last_action: False
obs_individual_obs: False
mac: "non_shared_mac"
agent: "rnn_ns"
use_rnn: False
standardise_returns: False
standardise_rewards: False
name: "qplex_ns"   # required: main.py names the sacred results dir after it
