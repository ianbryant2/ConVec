# --- QPLEX non-shared, MPE variant ---
# qplex_ns.yaml with the shared MPE base transferred from the EPyMARL paper's
# QMIX-ns MPE values (no MPE-tuned QPLEX exists in any paper): hidden 128,
# lr 3e-4, GRU, epsilon anneal 200k. Target update stays hard/200 because the
# ported dmaq_qatten_learner implements episode-count hard updates, not soft
# tau; reward standardisation stays off because the ported learner doesn't
# implement it (see qplex_ns.yaml) — the lower lr is the compensating lever.

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 200000
runner: "episode"
buffer_size: 5000
target_update_interval: 200   # episode-based, consumed by the ported learner
agent_output_type: "q"
learner: "dmaq_qatten_learner"
double_q: True
mixer: "dmaq"
mixing_embed_dim: 32
hypernet_embed: 64
adv_hypernet_layers: 3
adv_hypernet_embed: 64
num_kernel: 10
is_minus_one: True
weighted_head: True
is_adv_attention: True
is_stop_gradient: True

hidden_dim: 128
lr: 0.0003

evaluation_epsilon: 0.0
obs_agent_id: False
obs_last_action: False
obs_individual_obs: False
mac: "non_shared_mac"
agent: "rnn_ns"
use_rnn: True
standardise_returns: False
standardise_rewards: False
name: "qplex_ns_mpe"
