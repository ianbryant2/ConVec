# LBF with a concession budget (envs.yaml lbf_3p_2f_budget): PAC on
# Foraging-5x5-3p-2f-budget-v0, budgets c = (0.55, 0.8, 0.8), the
# joint_overspend_potential rule, 7M PAC steps, 5 seeds.
#
# The critic (concession.yaml `critic`) trains on exploration episodes only and
# is frozen at 500k t_env (`lbf_critic_data`); it is saved as
# concession_critic.pt in each run's sacred dir. PAC's entropy is annealed from
# 0.8 to its 0.02 floor over the first half of the run (3.5M), then 3.5M steps
# at the floor against the frozen critic, for the policies to converge.
#
#   python scripts/sweeps run lbf_td_converge_a0

seeds: [0, 1, 2, 3, 4]

base:
  - critic
  - lbf_critic_data
  - budget: {rule: joint_overspend_potential}

axes:
  alg: [pac_ns]
  env: [lbf_3p_2f_budget]
  # An axis, not base: the alg preset (entropy_end_ratio 1.0) overrides base.
  entropy:
    half: {entropy_end_ratio: 0.5}
