# SelfishSpread with the concession budget and a learned OptimQ critic:
# critic stability, the critic's data, budget rules and budgets, on the plain
# env and wider collision distances.
#
# The full grid is large; run slices of it, e.g.
#   python scripts/sweeps run selfish_spread alg=pac_ns env=selfish_spread variant=stable_explore_only rule=potential
#
# Old run_sweep.py variant -> axis options (budget c1_50_50 unless noted):
#   base, warmup, warmup_explore, stable, stable_noclip, slow,
#   stable_warmup_explore, stable_explore_only -> that variant, rule=signed
#   potential                   -> variant=stable_warmup_explore, rule=potential
#   potential_c166              -> ... budget=c1_6_6
#   potential_explore_only      -> variant=stable_explore_only, rule=potential
#   potential_explore_only_c166 -> ... budget=c1_6_6

seeds: [0, 1, 2]

base: mpe_optimq

axes:
  alg: [pac_ns, opt_vdn_ns, qmix_ns, vdn_ns]
  env: [selfish_spread, selfish_spread_col0.4, selfish_spread_col0.6]

  # The critic's stability fixes and data (presets/concession.yaml).
  variant:
    base: no_explore
    warmup: [warmup, {concession: {data: {explore_args: {constant: {rate: 0.0}}}}}]
    warmup_explore: [warmup, explore_rollouts]
    stable: stable
    stable_noclip: stable_noclip
    slow: slow
    stable_warmup_explore: [stable, warmup, explore_rollouts]
    stable_explore_only: [stable, warmup, explore_rollouts, explore_only]

  rule:
    signed: {budget: {rule: joint_budget_signed_increment}}
    # The same episode return as joint_overspend_increment minus the total
    # initial budget, paid step by step instead of mostly at the end.
    potential: {budget: {rule: joint_overspend_potential}}
    increment: {budget: {rule: joint_overspend_increment}}

  budget:
    c1_50_50: {budget: {initial_budget: [1.0, 50.0, 50.0]}}
    c1_6_6: {budget: {initial_budget: [1.0, 6.0, 6.0]}}
