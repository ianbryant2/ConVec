# LBF budget test (envs.yaml lbf_3p_2f_budget): every budget rule, with
# OptimQ trained on the agents' episodes plus exploration (own) or on
# exploration only (explore_only). Both give OptimQ 4 new episodes per agent
# episode, so they differ only in where the data comes from.
#
# Old run_sweep.py variant lbf_<rule>_<data> -> rule=<rule>, data=<data>.

seeds: [0, 1, 2]

base: lbf_optimq

axes:
  alg: [pac_ns, qmix_ns, vdn_ns, opt_vdn_ns]
  env: [lbf_3p_2f_budget]
  rule:
    increment: {budget: {rule: joint_overspend_increment}}
    signed: {budget: {rule: joint_budget_signed_increment}}
    potential: {budget: {rule: joint_overspend_potential}}
  data:
    own: lbf_own
    explore_only: lbf_explore_only
  # The concession critic (presets/concession.yaml lbf_optimq's settings go to
  # whichever model is chosen). optimq outputs one value per joint action (216
  # on this env); additive takes the joint action as an input, sharing each
  # agent's action embedding across joint actions
  # (epymarl/src/components/optimq_additive.py).
  model:
    optimq: {concession: {model: optimq}}
    additive: {concession: {model: optimq_additive_linear}}
  # How each critic samples its buffer (presets/concession.yaml per).
  replay:
    uniform: {}
    per: per
