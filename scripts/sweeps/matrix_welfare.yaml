# Budget Table 1 with non-binding budgets (envs.yaml table1_welfare):
# c = (20, 20, 20), so every joint action is within budget and the target is
# the social-welfare optimum (B, A, B) = 32. joint_overspend_potential rule.
# PAC and MAPPO (parallel runner, 500k steps) against VDN and QMIX (episode
# runner, 50k steps): the same 50k gradient updates (algs.yaml step_scale), as
# in matrix_table1 steps=50k. 5 seeds.
#
# The critic as in matrix_table1 (concession.yaml `critic` and
# `matrix_critic_data`), frozen at 25k t_env.
#
#   python scripts/sweeps run matrix_welfare

seeds: [0, 1, 2, 3, 4]

base:
  - critic
  - matrix_critic_data
  - budget: {rule: joint_overspend_potential}

axes:
  alg: [pac_ns, mappo_ns, vdn_ns, qmix_ns]
  env: [table1_welfare]
