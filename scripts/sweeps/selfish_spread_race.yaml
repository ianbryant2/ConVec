# The SelfishSpread race with a concession budget (envs.yaml
# selfish_spread_race): PAC on SelfishSpread-3ag-race-v0, budgets
# c = (3, 20, 20), the joint_overspend_potential rule, 3M PAC steps, 5 seeds.
#
# The critic as in lbf_td_converge (concession.yaml `critic` and
# `lbf_critic_data`): trained on exploration episodes only and frozen at 500k
# t_env, saved as concession_critic.pt in each run's sacred dir. PAC's entropy
# is annealed from 0.8 to its 0.02 floor over the first half of the run (1.5M),
# then 1.5M steps at the floor against the frozen critic, for the policies to
# settle.
#
#   python scripts/sweeps run selfish_spread_race

seeds: [0, 1, 2, 3, 4]

base:
  - critic
  - lbf_critic_data
  - budget: {rule: joint_overspend_potential}

axes:
  alg: [pac_ns]
  env: [selfish_spread_race]
