# LBF budget test (envs.yaml lbf_3p_2f_budget_mid): the td charge
# (V(s_t) - r_t - gamma V(s_t+1)) run to 3.5M PAC steps (about an hour), to see
# whether the agents reach the intended split within budget. In the 1.5M-step
# lbf_mlp_delta runs, td's agents were still moving toward it (agent 0's
# return climbing to its break-even) when training stopped. For the
# Pareto-AC paper's 14M steps (~3 h), use env lbf_3p_2f_budget.
#
# The critic as in lbf_mlp_delta (optimq_additive_mlp, double_cross, uniform
# replay, exploration only, greedy round robin, annealed to nothing and frozen
# at 500k t_env), but without reward_range, so it uses no knowledge of the env's
# rewards. The frozen critic is saved as concession_critic.pt in each run's
# sacred dir, to score with scripts/lbf_feasibility.py --load.

seeds: [0, 1, 2]

base:
  - lbf_optimq
  - lbf_explore_decay
  - double_cross
  - td_delta
  - no_reward_range
  - concession: {model: optimq_additive_mlp, head_layers: 1}
    budget: {rule: joint_overspend_potential}

axes:
  alg: [pac_ns]
  env: [lbf_3p_2f_budget_mid]
