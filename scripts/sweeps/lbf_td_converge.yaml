# LBF budget, td charge, run until the agents' policies converge. lbf_td_long
# (3.5M steps) was still improving when it stopped: agent 0's return and
# expected budget were still climbing. Its entropy coefficient annealed over the
# whole run (entropy_end_ratio 1.0), so PAC's objective changed up to the last
# step.
#
# Here: 7M PAC steps with the entropy annealed over the first half
# (entropy_end_ratio 0.5). The first 3.5M follow the same entropy schedule as
# lbf_td_long, then 3.5M steps at the 0.02 floor, with fixed charges (critic
# frozen at 500k) and a fixed objective, for the policies to settle. 5 seeds.
#
# The critic as in lbf_td_long: optimq_additive_mlp, double_cross, uniform
# replay, exploration only, greedy round robin, annealed to nothing and frozen
# at 500k t_env, no reward_range. Saved as concession_critic.pt in each run's
# sacred dir.

seeds: [0, 1, 2, 3, 4]

base:
  - lbf_optimq
  - lbf_explore_decay
  - double_cross
  - td_delta
  - no_reward_range
  - concession: {model: optimq_additive_mlp, head_layers: 1}
    budget: {rule: joint_overspend_potential}

axes:
  alg: [pac_ns]
  env: [lbf_3p_2f_budget_long]
  # An axis, not base: the alg preset (entropy_end_ratio 1.0) overrides base.
  entropy:
    half: {entropy_end_ratio: 0.5}
