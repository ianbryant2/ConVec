# The race layout (SelfishSpread-3ag-race-v0) with budgets of 100 that never
# bind, to see whether the concession critic converges there and what it
# charges, before choosing real budgets. Under td an episode's discounted charge
# telescopes to V(s_0) - G, so spend + G gives the frozen critic's start value
# V_i(s_0) whatever the policies do; budgets then follow from V and the returns
# of winning and giving way. The policies needn't converge.
#
# The critic as in selfish_spread_td (optimq_additive_mlp, double_cross, 0.08
# critic steps per transition, greedy exploration episodes only, no
# reward_range, td charge), but annealed over 500k t_env instead of 250k
# (lbf_explore_decay, epsilon at 0.1 by 150k): the board is 9x the area, so it
# gets twice the data, ~1M transitions. Then 100k steps against the frozen
# critic for test spends. Its training is independent of the policies
# (exploration only), so 2 seeds.
#
#   python scripts/sweeps run selfish_spread_race_critic

seeds: [0, 1]

base:
  - mpe_optimq
  - stable
  - lbf_explore_decay
  - double_cross
  - no_reward_range
  - td_delta
  - concession:
      model: optimq_additive_mlp
      head_layers: 1
      data: {warmup_steps: 100_000}
      training: {replay_ratio: 0.08}   # lbf_optimq's, not stable's 0.16
    budget: {rule: joint_overspend_potential}

axes:
  alg: [pac_ns]
  env: [selfish_spread_race]
