# Named settings blocks ("profiles") for the concession model, usable by name
# anywhere a sweep takes settings (base or an axis option, alone or in a
# list merged left to right).
#
# `concession:` is the learned model's block: `model` picks it
# (budget.concession) and every other key goes to
# budget.concession_args.<model>. Options and their defaults:
# epymarl/src/config/envs/gymma_budget.yaml; data/training:
# epymarl/src/components/concession_training.py.

profiles:
  # --- the critic -------------------------------------------------------
  # The concession critic used in every sweep: Q*_i(s, a) with the joint action
  # as an input (state and per-agent action embeddings added, then one hidden
  # layer; epymarl/src/components/optimq_additive.py), two critics combined
  # with the double estimator.
  #   delta: td       each step is charged V(s_t) - r_t - gamma V(s_t+1), so an
  #                   episode's discounted charge telescopes to V(s_0) - G and
  #                   the critic's errors at the states in between cancel
  #   double_cross    a critic's target net selects the next action and the
  #                   other critic's target net evaluates it
  #   reward_range    null: no clamp on bootstrapped values, so the critic
  #                   uses no knowledge of the env's rewards
  # with a slow target net, Huber loss and LayerNorm for stability.
  critic:
    concession:
      model: optimq_additive_mlp
      head_layers: 1
      delta: td
      target: double_cross
      target_tau: 0.005
      loss: huber
      layer_norm: true
      reward_range: null

  # --- the critic's data, per env ---------------------------------------
  # The critic trains only on exploration episodes, never the agents' own
  # (policy_fraction 0), so the policies cannot shape the data it is fitted
  # to. A random-play warmup, then exploration episodes played epsilon-greedy
  # on the critic's own Q* heads (the agents' heads in turn per episode), so it
  # tries the joint actions it overvalues and is corrected. Exploration
  # episodes per agent episode are annealed to 0, after which the critic gets
  # no more data and is frozen: the agents then learn against fixed charges.
  # replay_ratio: critic gradient steps per critic per new transition.

  # LBF, and the SelfishSpread race: a 100k-step warmup, exploration annealed
  # from 4 to 0 over 500k t_env (~1M transitions), epsilon from 1.0 to 0.1
  # over 150k.
  lbf_critic_data:
    concession:
      data:
        policy_fraction: 0.0
        warmup_steps: 100_000
        explore: anneal
        explore_args: {anneal: {start: 4.0, finish: 0.0, anneal_time: 500_000, decay: linear}}
        explore_policy: greedy
        explore_policy_args:
          greedy:
            epsilon: anneal
            epsilon_args: {anneal: {start: 1.0, finish: 0.1, anneal_time: 150_000, decay: linear}}
      training: {replay_ratio: 0.08}

  # Matrix games (50k one-step episodes): the LBF schedule scaled to the
  # shorter runs. A 5k-step warmup (~185 random samples per joint action of
  # Table 1's 27), exploration annealed from 4 to 0 over 25k t_env (~55k
  # transitions), epsilon from 1.0 to 0.1 over 7.5k. Frozen at 25k, half of
  # VDN/QMIX's run and 5% of PAC/MAPPO's.
  matrix_critic_data:
    concession:
      data:
        policy_fraction: 0.0
        warmup_steps: 5_000
        explore: anneal
        explore_args: {anneal: {start: 4.0, finish: 0.0, anneal_time: 25_000, decay: linear}}
        explore_policy: greedy
        explore_policy_args:
          greedy:
            epsilon: anneal
            epsilon_args: {anneal: {start: 1.0, finish: 0.1, anneal_time: 7_500, decay: linear}}
      training: {replay_ratio: 0.08}
