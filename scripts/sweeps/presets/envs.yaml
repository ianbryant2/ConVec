# Every env a sweep can use: its family (picks the alg settings in algs.yaml
# and the step scaling) and its settings. Budget envs set only what belongs to
# the env (enabled, initial_budget); the rule and concession model are the
# sweep's choice. `extends` takes the named env's family and settings, then
# applies these on top.

envs:
  # --- matrix games (one-step) -------------------------------------------------
  # Table 1 with c = (6, 6, 5): only (A, A, A) stays within budget.
  table1:
    family: matrix
    settings:
      env_args: {key: "matrix_envs:budget-table1-3p-v0", time_limit: 1}
      t_max: 50_000              # environment steps per run
      test_interval: 1_000       # -> ~50 greedy evaluation points per curve
      budget: {enabled: true, initial_budget: [6.0, 6.0, 5.0]}

  # Table 1 with c = (20, 20, 20): no payoff exceeds 16, so every joint action
  # stays within budget and the best feasible cell is the social-welfare
  # optimum, (B, A, B) at 32.
  table1_welfare:
    extends: table1
    settings:
      budget: {initial_budget: [20.0, 20.0, 20.0]}

  # --- Level-Based Foraging ------------------------------------------------
  # 3 level-1 agents, 2 apples paying 1/2 each, split among the agents loading
  # it (lbf_envs/__init__.py). Agent 0 should eat one apple alone and agents 1
  # and 2 share the other, conceding about [0.47, 0.75, 0.75]; the budget allows
  # that and rules out the alternatives (the closest, all three sharing the
  # second apple, sits right at 0.8 for agents 1 and 2). Long enough for the
  # agents to converge: PAC 7M steps (~1h45 per run), evaluated every 50k with
  # 100 episodes (EPyMARL's evaluation size).
  lbf_3p_2f_budget:
    family: lbf
    settings:
      env_args: {key: "lbf_envs:Foraging-5x5-3p-2f-budget-v0", time_limit: 25}
      t_max: 700_000
      test_interval: 5_000
      test_nepisode: 100
      budget: {enabled: true, initial_budget: [0.55, 0.8, 0.8], observe_budget: all}

  # The same budgets permuted: spawns are random, so the agents are
  # interchangeable and the tight 0.55 picks who eats an apple alone.
  lbf_3p_2f_budget_a1:
    extends: lbf_3p_2f_budget
    settings:
      budget: {initial_budget: [0.8, 0.55, 0.8]}

  lbf_3p_2f_budget_a2:
    extends: lbf_3p_2f_budget
    settings:
      budget: {initial_budget: [0.8, 0.8, 0.55]}

  # c = 1.5 for every agent: an agent's return is at most 1, so no outcome is
  # ruled out and nobody is singled out to eat alone.
  lbf_3p_2f_budget_loose:
    extends: lbf_3p_2f_budget
    settings:
      budget: {initial_budget: [1.5, 1.5, 1.5]}
