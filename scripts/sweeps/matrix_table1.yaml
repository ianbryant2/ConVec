# Budget Table 1 (one-step, c = (6, 6, 5)) with a learned critic: SelfishSpread's
# potential setting scaled to 50k-step matrix games. OptimQ trains on
# exploration only, one random episode per agent episode after a 5k-step
# warmup, with 4 critic steps per transition and Table 1's reward range. With
# one step left the bounds are 0, so the clamp also zeroes the bootstrap past
# the last step.
#
# Old run_sweep.py variants: matrix_potential -> model=optimq,
# matrix_potential_additive -> model=additive.

seeds: [0, 1, 2]

base:
  - stable
  - matrix_explore
  - explore_only
  - concession: {reward_range: [0.0, 16.0], training: {replay_ratio: 4.0}}
    budget: {rule: joint_overspend_potential}

axes:
  alg: [pac_ns, opt_vdn_ns, qmix_ns, vdn_ns]
  env: [table1]
  model:
    optimq: {concession: {model: optimq}}
    # The critic takes the joint action as an input
    # (epymarl/src/components/optimq_additive.py).
    additive: {concession: {model: optimq_additive_linear}}
