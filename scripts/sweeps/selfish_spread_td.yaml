# SelfishSpread with the critic recipe from the LBF td runs (lbf_td_long), to
# see whether it fixes OptimQ's divergence here (by 150k in the PAC runs):
# optimq_additive_mlp, double_cross, greedy exploration episodes only, annealed
# to nothing and frozen at 250k t_env (mpe_explore_decay), no reward_range.
# 1M PAC steps, so the agents get 750k against the frozen critic.
#
# The charge is the axis: td (V(s_t) - r_t - gamma V(s_t+1)), whose discounted
# episode total telescopes to V(s_0) - G so the critic's errors at the states
# in between cancel, against advantage (V(s_t) - Q(s_t, a_t)).
#
#   python scripts/sweeps run selfish_spread_td

seeds: [0, 1, 2, 3, 4]

base:
  - mpe_optimq
  - stable
  - mpe_explore_decay
  - double_cross
  - no_reward_range
  - concession:
      model: optimq_additive_mlp
      head_layers: 1
      data: {warmup_steps: 100_000}
      training: {replay_ratio: 0.08}   # lbf_optimq's, not stable's 0.16
    budget: {rule: joint_overspend_potential}

axes:
  alg: [pac_ns]
  env: [selfish_spread_long]
  delta:
    td: td_delta
